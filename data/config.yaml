city: Amsterdam
timezone: Europe/Amsterdam
language_out: en          # en | nl — ngôn ngữ template gửi ra ngoài
language_agent: vi        # ngôn ngữ agent nói với bạn

models:
  # Advisory routing: chỉ áp dụng nếu runtime cho phép chọn model.
  intent_analyze: gpt-5.6-luna
  sublet_backfill: gpt-5.6-luna
  draft: gpt-6-astra
  inbox_triage: gpt-6-astra
  partner_voice: gpt-6-astra

hours:
  start: "00:00"
  end: "23:59"  # 24/7 theo yêu cầu Kien 2026-09-16; xem CLAUDE.md #3
scan:
  cadence_minutes: 12
  max_page_loads_per_cycle: 4
  max_group_page_opens_per_day: 20   # mở trang group riêng lẻ (đọc full post)
  random_break_per_day: 3            # số lần nghỉ ngẫu nhiên 30–60'

offer:
  price_eur: 49
  fee_trigger: move_in        # move_in | three_viewings_72h — đổi sau 10 deal nếu thu <70%
  promise: "3 qualified viewings within 72h, or free"
  attribution_days: 30
  your_first_name: "Kien"

email:
  imap_host: imap.gmail.com
  imap_user: ""           # Gmail nhận notification Facebook
  imap_app_password_env: SUBLET_IMAP_PASS   # đặt trong shell, không commit
  from_filter: facebookmail.com

seeker_form:
  provider: tally
  url: ""                  # link form seeker; dùng làm offer_link "apply via ..."
  csv_export_path: data/seekers_export.csv   # Tally → export CSV → seeker-intake đọc

scam:
  flags:
    - deposit_before_viewing
    - price_below_market_30pct
    - stock_photo_language
    - new_account_claim
    - wire_or_crypto
    - no_address_no_area
    - overseas_owner_story
